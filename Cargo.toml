[package]
name = "model-rs"
version = "0.1.3"
edition = "2024"
authors = ["Ying Kit WONG"]
description = "A Rust CLI tool for downloading HuggingFace models and running local LLM inference"
repository = "https://github.com/yingkitw/model-rs"
license = "Apache-2.0"
keywords = ["llm", "machine-learning", "huggingface", "inference", "cli"]
categories = ["command-line-utilities", "science", "api-bindings"]
readme = "README.md"

[lib]
name = "model_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
once_cell = "1.19"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
serde_yaml = "0.9"
indicatif = "0.17"
futures-util = "0.3"
urlencoding = "2.1"
rand = "0.8"
bytes = "1.9"
directories = "5.0"
base64 = "0.22"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
termimad = "0.30"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

# Web server dependencies
axum = "0.8"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }

# Local ML inference dependencies
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
candle-metal-kernels = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["progressbar", "fancy-regex"] }

[dev-dependencies]
tempfile = "3.14"
mockito = "1.6"
tower = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
# Used by `tests/*.rs` integration binaries (not linked through `model_rs` alone).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "native-tls"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "throughput"
harness = false

[features]
default = ["metal"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[[bin]]
name = "model-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
